<script>
  const p = new URLSearchParams(location.search);
  if (p.get("auth") !== "1") {
    location.replace("https://pid-auth-worker.hyun090701.workers.dev");
  }
</script>
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>피드앱</title>

  <!-- 보안(가능한 범위에서 강화) -->
  <meta http-equiv="Content-Security-Policy"
        content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
        base-uri 'none';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
        " />
  <meta name="referrer" content="no-referrer" />

  <style>
  
.btn,
.toggle{
  pointer-events: auto;
}
.btn,
.toggle{
  touch-action: manipulation;
}
.app,
.phone{
  pointer-events: auto;
}

    :root{--card: rgba(255,255,255,0.92);
--line: rgba(255,255,255,0.10);
--shadow: 0 18px 55px rgba(0,0,0,.45);
      --bg:#0b0f14;
      --panel: rgba(255,255,255,0.06);
      --panelLine: rgba(255,255,255,0.10);

   
     --text: rgba(15,23,42,0.92);
--muted: rgba(15,23,42,0.55);

      --btn:#111827;
      --btnText:#ffffff;
      --btn2:#f3f4f6;
      --btn2Text:#111827;

      --chip:#f3f4f6;
    

      --radiusPhone: 28px;
      --radiusCard: 18px;
      --radiusBtn: 14px;
      --padPhone: 16px;
      --padCard: 16px;

      --tap: 44px; /* 최소 터치 영역 */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: #fff;
    }
    button{ font: inherit; }
    a{ color: inherit; text-decoration: none; }

    .app{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px 14px;
    }
  .phone{
  width: min(420px, 100%);
  border-radius: var(--radiusPhone);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  padding: var(--padPhone);
  box-shadow: 0 18px 70px rgba(0,0,0,.55);
  backdrop-filter: blur(14px);
}


    /* 상단 바 */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 6px 6px 12px;
      color: rgba(255,255,255,0.92);
    }
    .brand{
      display:flex; gap:10px; align-items:center;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
    }
    .timer{
  font-variant-numeric: tabular-nums;
  font-weight: 900;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  user-select:none;
}

    
  
    }

    /* 카드 */
    .card{
      background: var(--card);
      border-radius: var(--radiusCard);
      padding: var(--padCard);
      color: var(--text);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .title{
      font-size: 16px;
      font-weight: 900;
      margin: 2px 0 0;
      letter-spacing: 0.1px;
    }
    .sub{
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .avatar{
      width: 54px;
      height: 70px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e5e7eb, #f9fafb);
      border: 1px solid rgba(15, 23, 42, 0.10);
      display:flex; align-items:center; justify-content:center;
      color: rgba(15,23,42,.55);
      font-weight: 900;
      user-select:none;
    }

    .divider{ height:1px; background: var(--line); margin: 14px 0; }

    .kv{
      display:grid;
      grid-template-columns: 92px 1fr;
      gap: 8px 10px;
      font-size: 13px;
      line-height: 1.35;
    }
    .k{ color: var(--muted); font-weight: 800; }
    .v{ color: var(--text); font-weight: 900; letter-spacing: 0.1px; }

    /* 토글(흰색 레버) */
    .toggleWrap{
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .toggle{
      width: 58px;
      height: 32px;
      border-radius: 999px;
      background: #e5e7eb;
      border: 1px solid rgba(15,23,42,0.12);
      position: relative;
      cursor: pointer;
      padding: 2px;
      flex: 0 0 auto;
      min-height: var(--tap);
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }
    .toggle .knob{
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      transform: translateX(0);
      transition: transform .18s ease;
    }
    .toggle[data-on="1"]{ background: #111827; justify-content:flex-end; }
    .toggle[data-on="1"] .knob{ transform: translateX(0); }

    .actions{
      display:grid;
      gap: 10px;
      margin-top: 14px;
    }
    .btn{
  border: none;
  background: var(--btn);
  color: var(--btnText);
  border-radius: 16px;
  padding: 16px 14px;
  font-weight: 900;
  letter-spacing: 0.2px;
  cursor: pointer;
  min-height: 52px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
}

    }
    .btn.secondary{
      background: var(--btn2);
      color: var(--btn2Text);
      border: 1px solid rgba(15,23,42,0.10);
    }

    /* 화면 전환 */
    .view{ display:none; }
    .view.active{ display:block; }

    /* QR 화면 */
    .qrBox{
      margin-top: 12px;
      border-radius: 16px;
      border: 1px dashed rgba(15,23,42,0.25);
      background: #fafafa;
      padding: 16px;
      color: #111827;
      text-align:center;
      font-weight: 900;
      user-select:none;
    }

    /* 관리자 버튼(기본 숨김, admin=1일 때만 보임) */
    .adminBar{
      display:none;
      margin-top: 10px;
      gap: 10px;
    }
    .adminBar.active{
      display:flex;
    }
   .note{
  margin-top: 10px;
  color: rgba(255,255,255,0.55);
  font-size: 12px;
  line-height: 1.45;
  padding: 0 6px;
}

    }
  </style>
</head>
<body>
  <div class="app">
    <div class="phone">
      <div class="topbar">
        <div class="brand"><span class="dot"></span><span>피드앱</span></div>
        <div class="timer">남은시간 <span id="t">30</span>s</div>
      </div>

      <!-- ====== VIEW 1: 기본(첫 화면) ====== -->
      <section id="view1" class="view active">
        <div class="card">
          <div class="row">
            <div>
              <div class="title" id="name">홍길동</div>
              <div class="sub">모바일 신분증</div>
            </div>
            <div class="avatar" id="avatar">사진</div>
          </div>

          <div class="divider"></div>

          <div class="kv">
            <div class="k">생년월일</div><div class="v" id="dob">2009.07.01</div>
            <div class="k">발급기관</div><div class="v" id="issuer">Incheon</div>
            <div class="k">식별번호</div><div class="v" id="idno">ABCD-1234</div>
          </div>

          <div class="actions">
            <button class="btn" id="goDetail">상세정보 표시</button>
          </div>

          <!-- 관리자(숨김): admin=1일 때만 표시 -->
          <div id="adminBar" class="adminBar">
            <button class="btn secondary" id="openAdmin">관리자 열기</button>
          </div>
        </div>

        <div class="note">
          ※ 보기 전용 화면입니다. 관리자 버튼은 기본 숨김이며, 필요 시 주소에 <b>?admin=1</b>을 붙이면 표시됩니다.
        </div>
      </section>

      <!-- ====== VIEW 2: 상세정보 버튼 있는 화면 ====== -->
      <section id="view2" class="view">
        <div class="card">
          <div class="row">
            <div>
              <div class="title">상세 정보</div>
              <div class="sub">레버(토글)로 상세 노출</div>
            </div>

            <div class="toggleWrap">
              <div class="toggle" id="toggle" role="switch" aria-checked="false" tabindex="0" data-on="0">
                <div class="knob"></div>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="kv">
            <div class="k">표시상태</div><div class="v" id="detailState">숨김</div>
            <div class="k">안내</div><div class="v">레버 ON → 3번째 화면</div>
          </div>

          <div class="actions">
            <button class="btn" id="goQR2">QR정보 표시</button>
            <button class="btn secondary" id="back1a">첫 화면으로</button>
          </div>
        </div>
      </section>

      <!-- ====== VIEW 3: 상세정보 노출 화면 ====== -->
      <section id="view3" class="view">
        <div class="card">
          <div class="title">상세 정보(노출)</div>
          <div class="sub">레버 ON 상태 화면</div>

          <div class="divider"></div>

          <div class="kv">
            <div class="k">주소</div><div class="v">인천광역시 …</div>
            <div class="k">발급일</div><div class="v">2026.01.30</div>
            <div class="k">비고</div><div class="v">예시 데이터</div>
          </div>

          <div class="actions">
            <button class="btn" id="goQR3">QR정보 표시</button>
            <button class="btn secondary" id="back2">상세 화면으로</button>
          </div>
        </div>
      </section>

      <!-- ====== QR 화면: 복귀는 1번으로 ====== -->
      <section id="viewQR" class="view">
        <div class="card">
          <div class="title">QR 정보</div>
          <div class="sub">버튼 누르면 1번(기본)으로 복귀</div>

          <div class="qrBox">[ QR 자리 ]</div>

          <div class="actions">
            <button class="btn" id="backTo1">첫 화면으로 복귀</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script>
    // ===== 타이머: 앱 시작과 동시에 30 -> 0 -> 30 반복 (화면 전환과 무관) =====
    (function timerLoop(){
      let t = 30;
      let dir = -1; // -1: 감소, +1: 증가
      const el = document.getElementById('t');
      el.textContent = String(t);

      setInterval(() => {
        t += dir;
        if (t <= 0) { t = 0; dir = +1; }
        else if (t >= 30) { t = 30; dir = -1; }
        el.textContent = String(t);
      }, 1000);
    })();

    // ===== 화면 전환 =====
    const views = ["view1","view2","view3","viewQR"].map(id => document.getElementById(id));
    function show(id){
      for (const v of views) v.classList.remove("active");
      document.getElementById(id).classList.add("active");
    }

    // ===== 버튼 동작(요구사항 그대로) =====
    document.getElementById("goDetail").addEventListener("click", () => show("view2"));
    document.getElementById("back1a").addEventListener("click", () => show("view1"));
    document.getElementById("back2").addEventListener("click", () => show("view2"));
    document.getElementById("goQR2").addEventListener("click", () => show("viewQR"));
    document.getElementById("goQR3").addEventListener("click", () => show("viewQR"));
    document.getElementById("backTo1").addEventListener("click", () => show("view1"));

    // ===== 토글(흰색 레버): 2번 화면에서 ON 하면 3번 화면으로 =====
    const toggle = document.getElementById("toggle");
    const detailState = document.getElementById("detailState");

    function setToggle(on){
      toggle.dataset.on = on ? "1" : "0";
      toggle.setAttribute("aria-checked", on ? "true" : "false");
      detailState.textContent = on ? "노출" : "숨김";
      if (on) show("view3");
      else show("view2");
    }
    function flipToggle(){
      const on = toggle.dataset.on === "1";
      setToggle(!on);
    }
    toggle.addEventListener("click", flipToggle);
    toggle.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flipToggle(); }
    });
    setToggle(false);
    // 앱 시작 / 복원 시 항상 첫 화면으로
window.addEventListener("pageshow", () => {
  setToggle(false);
  show("view1");
});


    // ===== 관리자 숨김/표시: URL에 ?admin=1 이면 표시 =====
    const params = new URLSearchParams(location.search);
    const adminBar = document.getElementById("adminBar");
    if (params.get("admin") === "1") adminBar.classList.add("active");

    // 관리자 페이지는 '원본'에서 여는 게 제일 안정적이므로 새 탭으로 열기
    document.getElementById("openAdmin")?.addEventListener("click", () => {
      window.open("https://pid-app.pages.dev", "_blank", "noopener,noreferrer");
    });
  </script>
</body>
</html>
